name: Source checks

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  source:
    name: Source checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.94.1
      - name: Use macOS Command Line Tools
        if: runner.os == 'macOS'
        run: echo "DEVELOPER_DIR=/Library/Developer/CommandLineTools" >> "$GITHUB_ENV"
      - run: bun install --frozen-lockfile
      - name: Prepare pinned native test resources
        run: bun run prepare:sidecar
      - name: Check current source
        run: bun run check

  workbench:
    name: Rebuild pinned workbench
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Checkout pinned OpenCode workbench source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: anomalyco/opencode
          ref: 826d9ad46a22bef0294998e08daa3c4904fea28f
          path: opencode-v1.18.21
      - run: bun install --frozen-lockfile
        working-directory: opencode-v1.18.21
      - name: Build complete workbench from source
        env:
          YUME_OPENCODE_SRC: ${{ github.workspace }}/opencode-v1.18.21
        run: bun run prepare:workbench
