name: finalize macOS release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semver without the v prefix
        required: true
        type: string

permissions:
  contents: write

jobs:
  finalize:
    name: Sign macOS updater and merge manifest
    runs-on: ubuntu-latest
    steps:
      - name: Validate input
        env:
          VERSION: ${{ inputs.version }}
        run: '[[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]'

      - name: Checkout matching tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: v${{ inputs.version }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Check tag and app versions
        shell: pwsh
        run: ./scripts/check-version.ps1 -TagName "v${{ inputs.version }}"

      - name: Download draft payloads and Windows manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
        run: |
          test "$(gh release view "v$VERSION" --json isDraft --jq .isDraft)" = true
          mkdir downloads
          gh release download "v$VERSION" --dir downloads \
            --pattern "YUME_${VERSION}_aarch64.dmg" \
            --pattern "YUME_${VERSION}_aarch64.app.zip" \
            --pattern "YUME_${VERSION}_aarch64.app.tar.gz" \
            --pattern latest.json
          test "$(find downloads -maxdepth 1 -type f | wc -l)" = 4

      - name: Sign updater payload
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VERSION: ${{ inputs.version }}
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY"
          bun run tauri signer sign "downloads/YUME_${VERSION}_aarch64.app.tar.gz"
          test -s "downloads/YUME_${VERSION}_aarch64.app.tar.gz.sig"

      - name: Merge updater metadata and finalize checksums
        env:
          VERSION: ${{ inputs.version }}
          REPOSITORY: ${{ github.repository }}
        run: |
          mkdir final
          scripts/merge-updater-manifest.ts \
            downloads/latest.json final/latest.json "$VERSION" "$REPOSITORY" \
            "downloads/YUME_${VERSION}_aarch64.app.tar.gz.sig"
          (cd downloads && sha256sum \
            "YUME_${VERSION}_aarch64.dmg" \
            "YUME_${VERSION}_aarch64.app.zip" \
            "YUME_${VERSION}_aarch64.app.tar.gz" \
            "YUME_${VERSION}_aarch64.app.tar.gz.sig" > ../final/SHA256SUMS-macos.txt)

      - name: Upload final updater assets to draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
        run: |
          test "$(gh release view "v$VERSION" --json isDraft --jq .isDraft)" = true
          gh release upload "v$VERSION" \
            "downloads/YUME_${VERSION}_aarch64.app.tar.gz.sig" \
            final/SHA256SUMS-macos.txt
          gh release upload "v$VERSION" --clobber final/latest.json
          mkdir remote
          gh release download "v$VERSION" --dir remote \
            --pattern "YUME_${VERSION}_aarch64.app.tar.gz.sig" \
            --pattern SHA256SUMS-macos.txt \
            --pattern latest.json
          cmp "downloads/YUME_${VERSION}_aarch64.app.tar.gz.sig" \
            "remote/YUME_${VERSION}_aarch64.app.tar.gz.sig"
          cmp final/SHA256SUMS-macos.txt remote/SHA256SUMS-macos.txt
          cmp final/latest.json remote/latest.json
