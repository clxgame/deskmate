name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  draft:
    name: Prepare draft release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Check tag and app versions
        shell: pwsh
        run: ./scripts/check-version.ps1 -TagName "${{ github.ref_name }}"

      - name: Create or reuse an unpublished draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if is_draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft); then
            test "$is_draft" = true || { echo "Refusing to change a published release"; exit 1; }
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "YUME $RELEASE_TAG" --notes "Build verification in progress."
          fi

  windows:
    name: Windows signed release
    needs: draft
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.94.1

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check tag and app versions
        shell: pwsh
        run: ./scripts/check-version.ps1 -TagName "${{ github.ref_name }}"

      - name: Verify built-in persona boundary
        run: bun test scripts/bundled-personas.test.ts

      - name: Build and upload draft release
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: YUME ${{ github.ref_name }}
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          tauriScript: bun run tauri
          retryAttempts: 1

      - name: Verify application and installer icon resources
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          ./scripts/verify-windows-icon.ps1 -BinaryPath "src-tauri/target/release/yume.exe"
          ./scripts/verify-windows-icon.ps1 -BinaryPath "src-tauri/target/release/bundle/nsis/YUME_${version}_x64-setup.exe" -ExpectedIconPath "src-tauri/nsis/installer.ico"

  macos:
    name: macOS unsigned candidate (local signing required)
    needs: draft
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Check native architecture
        run: test "$(uname -m)" = arm64

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.94.1

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check frontend and prepare native resources
        run: |
          bun run typecheck
          bun test scripts/macos-release.test.ts \
            src/settings/UpdateFooter.test.tsx \
            src/settings/updateErrors.test.ts \
            src/settings/updateState.test.ts
          bun run prepare:sidecar
          bun run build

      - name: Test pet recovery and settings geometry
        run: |
          cargo test --locked --manifest-path src-tauri/Cargo.toml --lib pet_
          cargo test --locked --manifest-path src-tauri/Cargo.toml --lib settings::geometry_tests

      - name: Build macOS app
        run: bun run tauri build --no-sign --bundles app --ci

      # Developer ID keys stay on the maintainer's Mac. An unsigned candidate
      # must never be attached to Releases or named like an installable download.
      - name: Archive unsigned candidate (NOT a release download)
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            src-tauri/target/release/bundle/macos/YUME.app \
            "$RUNNER_TEMP/YUME.unsigned.app.zip"
          unzip -tq "$RUNNER_TEMP/YUME.unsigned.app.zip"

      - name: Store candidate for local signing, never upload to Releases
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: macos-unsigned-${{ github.sha }}
          path: ${{ runner.temp }}/YUME.unsigned.app.zip
          if-no-files-found: error
          retention-days: 14

      - name: Record mandatory local release gate
        run: |
          echo '### macOS is NOT release-ready' >> "$GITHUB_STEP_SUMMARY"
          echo 'The Actions artifact is an unsigned build candidate, not a user download.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Run scripts/release-macos.sh locally, then scripts/publish-macos.sh. See docs/macos-release.md. Do not publish the draft until those checks pass.' >> "$GITHUB_STEP_SUMMARY"
