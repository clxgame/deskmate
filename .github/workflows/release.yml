name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    name: Windows signed release
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.94.1

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check tag and app versions
        shell: pwsh
        run: ./scripts/check-version.ps1 -TagName "${{ github.ref_name }}"

      - name: Verify built-in persona boundary
        run: bun test scripts/bundled-personas.test.ts

      - name: Build and upload draft release
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: YUME ${{ github.ref_name }}
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          tauriScript: bun run tauri
          retryAttempts: 1

      - name: Verify application and installer icon resources
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          ./scripts/verify-windows-icon.ps1 -BinaryPath "src-tauri/target/release/yume.exe"
          ./scripts/verify-windows-icon.ps1 -BinaryPath "src-tauri/target/release/bundle/nsis/YUME_${version}_x64-setup.exe" -ExpectedIconPath "src-tauri/nsis/installer.ico"
