name: verify-assets-token

# Manual smoke test for DESKMATE_ASSETS_TOKEN. The release workflow only runs on
# a tag, so without this there is no way to confirm the token can reach the
# private assets repo before committing to a release tag.
on:
  workflow_dispatch:

jobs:
  verify:
    name: Fetch persona assets
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Fetch persona assets with the CI token
        env:
          DESKMATE_ASSETS_TOKEN: ${{ secrets.DESKMATE_ASSETS_TOKEN }}
        run: bun scripts/prepare-personas.ts

      - name: Assert every persona asset landed
        shell: pwsh
        run: |
          $glb = (Get-ChildItem public/personas -Recurse -Filter *.glb).Count
          $png = (Get-ChildItem public/personas -Recurse -Filter *.png).Count
          Write-Host "glb=$glb png=$png"
          if ($glb -lt 26) { throw "expected 26 .glb models, found $glb" }
          if ($png -lt 93) { throw "expected 93 texture PNGs, found $png" }
          Write-Host "persona assets verified"
