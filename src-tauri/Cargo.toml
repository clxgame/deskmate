[package]
name = "deskmate"
version = "0.1.6"
description = "Desktop AI pet powered by an embedded OpenCode sidecar"
edition = "2021"

[lib]
name = "deskmate_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "macos-private-api", "tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
chrono = "0.4"
url = "2"
ureq = { version = "2", features = ["json"] }
keyring = { version = "3", features = ["windows-native", "apple-native"] }
zip = { version = "8", default-features = false, features = ["deflate"] }
sha2 = "0.10"
rusqlite = { version = "0.40.2", features = ["bundled"] }
uuid = { version = "1.25.0", features = ["v4"] }
tauri-plugin-dialog = "2.7.2"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2"
